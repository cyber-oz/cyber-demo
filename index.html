<title>cyberOZ Interactive Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: the real cyberOZ app shell (sidebar + main), a thin demo banner on top, a floating tour card. Single light theme on purpose: it mirrors the product. */
:root{
  color-scheme:light;
  --ground:#FAF9F7; --rail:#F4F2EE; --card:#FFFFFF; --line:#E8E4DE; --line2:#F0EDE8; --line3:#DDD8D0;
  --ink:#1F1D1A; --ink2:#3D3934; --mute:#8A847B; --mute2:#9A948B; --head:#7A746B; --zebra:#FBFAF8;
  --accent:#660033; --accent-d:#4A0025; --accent-t:#F5EAEF;
  --ok:#1E6B43; --ok-b:#E8F3EC; --ok-d:#2E8B57;
  --bad:#A3261A; --bad-b:#FBEAE8; --bad-d:#D03A2B;
  --info:#1D4F8F; --info-b:#E9F0FA; --info-d:#3B78C9;
  --warn:#8A5A00; --warn-b:#FBF1DC; --warn-d:#D99A1E;
  --neu:#57524B; --neu-b:#F1EEE9; --neu-d:#A39D94;
  --bar:#ECE8E2;
  --sans:Geist,"Helvetica Neue",Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* demo banner */
.banner{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--accent);color:#fff;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13px}
.banner b{font-weight:600}
.banner .sp{flex:1}
.banner .for{opacity:.85}
.bbtn{height:30px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font:500 13px var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.bbtn.solid{background:#fff;color:var(--accent);border-color:#fff}
.bbtn:hover{background:rgba(255,255,255,.12)}
.bbtn.solid:hover{background:#F5EAEF}

.shell{display:flex;min-height:calc(100% - 46px)}
nav.side{width:236px;flex-shrink:0;background:var(--rail);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:46px;height:calc(100vh - 46px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 14px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font:600 13px var(--serif)}
.org{display:flex;justify-content:space-between;align-items:center;width:100%;height:42px;padding:0 12px;margin-bottom:8px;border:1px solid var(--line3);border-radius:8px;background:var(--card);text-align:left;cursor:default}
.org small{display:block;color:var(--mute);font-size:11.5px}
.nav{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:7px;font:400 14px var(--sans);color:var(--ink2);text-decoration:none;border:0;background:transparent;cursor:pointer;width:100%;text-align:left}
.nav:hover{background:#ECE9E3}
.nav.on{background:var(--accent-t);color:var(--accent);font-weight:500}
.nav svg{flex-shrink:0}
.nav .soon{margin-left:auto;font-size:11px;color:var(--mute2)}
.grp{font:500 11.5px var(--sans);color:var(--mute2);padding:14px 10px 4px;letter-spacing:.02em}
.av{width:22px;height:22px;border-radius:50%;background:#EDE6DD;color:var(--neu);font:600 10px var(--sans);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}

main{flex:1;min-width:0;padding-block:28px 120px;padding-left:max(16px,min(40px,4vw));padding-right:max(16px,min(40px,4vw));display:flex;flex-direction:column;gap:22px}
.crumb{font-size:13px;color:var(--mute)}
.crumb a{color:var(--mute);text-decoration:none;cursor:pointer}
.crumb a:hover{color:var(--accent)}
h1{margin:0;font:600 30px/1.15 var(--serif);text-wrap:balance}
h2{margin:0;font:600 17px var(--sans)}
.sub{font-size:12.5px;color:var(--mute)}
.lead{font-size:14px;color:var(--mute)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:0}
.pad{padding:20px 24px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.rgrid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr)}
.grid2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1180px){.cgrid,.rgrid2{grid-template-columns:repeat(2,minmax(0,1fr))}.rgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.rgrid>:first-child{grid-column:1/-1}}

.btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:8px;font:500 13.5px var(--sans);cursor:pointer;border:1px solid transparent;background:transparent;color:var(--ink2);white-space:nowrap}
.btn:hover{background:#F1EEE9}
.bp{background:var(--accent);color:#fff}
.bp:hover{background:var(--accent-d)}
.bs{background:var(--card);border-color:var(--line3);color:var(--ink)}
.bs:hover{background:#F7F5F2}
.sm{height:30px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}

.bdg{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font:500 12.5px var(--sans);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.ok{background:var(--ok-b);color:var(--ok)}.ok .dot{background:var(--ok-d)}
.bad{background:var(--bad-b);color:var(--bad)}.bad .dot{background:var(--bad-d)}
.info{background:var(--info-b);color:var(--info)}.info .dot{background:var(--info-d)}
.warn{background:var(--warn-b);color:var(--warn)}.warn .dot{background:var(--warn-d)}
.neu{background:var(--neu-b);color:var(--neu)}.neu .dot{background:var(--neu-d)}
.reqs{display:flex;flex-wrap:nowrap;gap:4px}
.req{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;background:#fff;border:1px solid var(--line);font:500 11.5px var(--sans);white-space:nowrap;color:var(--neu)}
.req b{font-weight:600;color:var(--ink)}

.big{font:600 40px/1 var(--serif);font-variant-numeric:tabular-nums}
.num{font:600 20px var(--sans);font-variant-numeric:tabular-nums}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.mini{width:56px;height:5px;border-radius:3px;background:var(--bar);overflow:hidden;display:flex;flex-shrink:0}

.lt{width:32px;height:32px;border-radius:8px;background:#fff;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.lt img{max-width:66%;max-height:66%;display:block}
.lt.ls{width:24px;height:24px;border-radius:6px}
.lt.lg{width:52px;height:52px;border-radius:12px}
.lt .g{font:700 15px/1 Arial,sans-serif;color:#4285F4}
.lt.lg .g{font-size:26px}.lt.ls .g{font-size:12px}
.datebadge{display:inline-flex;align-items:center;gap:10px;padding:7px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.datebadge:hover{border-color:var(--line3)}
.datebadge b{display:block;font:600 13.5px var(--sans)}
.datebadge svg{color:var(--accent)}
.fwt{width:52px;height:52px;border-radius:12px;background:#fff;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;text-align:center;font:600 11px/1.1 var(--sans);flex-shrink:0}
.fwt.ls{width:40px;height:40px;font-size:9.5px;border-radius:9px}
.fwrow{display:flex;gap:6px;flex-wrap:wrap}
.fwt img{max-width:80%;max-height:80%;display:block}
.fwt.lf{width:48px;height:48px}
.chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 6px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:13.5px;cursor:pointer}
.chip:hover{border-color:var(--line3)}

/* risks */
.mx{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:4px;align-items:center;font-size:12.5px}
.mx .rl{color:var(--mute);text-align:right;padding-right:8px;white-space:nowrap}
.mx .c{height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink2)}
.mx .cl{color:var(--mute);text-align:center;font-size:11.5px;padding-top:4px}
.z1{background:#E8F3EC}.z2{background:#FBF1DC}.z3{background:#F9E6DA}.z4{background:#F8E3E3}
.seg{display:inline-flex;background:var(--neu-b);border-radius:9px;padding:3px}
.seg button{height:28px;padding:0 12px;border:0;border-radius:7px;background:transparent;font:500 13px var(--sans);color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.legend{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:5px 0}
.nbox{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;cursor:pointer}
.nbox:hover{border-color:var(--line3)}
.rcard{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.fixhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rescan-m,.rcat-m,.ra-m,.rsub-m{display:none}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 20px;cursor:pointer;flex-wrap:wrap}
.rhead:hover{background:var(--zebra)}
.prog2{width:90px;height:5px;border-radius:3px;background:var(--bar);overflow:hidden;display:inline-block;vertical-align:middle}
.prog2 span{display:block;height:5px;background:var(--ok-d)}

/* hover-only buttons */
.hov{position:relative;cursor:default;opacity:.92}
.hov:hover{background:var(--card)}
.hov:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);right:0;background:var(--ink);color:#fff;font:400 12.5px/1.35 var(--sans);padding:7px 10px;border-radius:8px;white-space:nowrap;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.dbody .hov:hover::after{bottom:auto;top:calc(100% + 8px)}
.side .hov{opacity:1}
.side .ctlnav{cursor:pointer}
.side .hov:hover{background:#ECE9E3}
.side .hov:hover::after{left:8px;right:auto;bottom:auto;top:calc(100% + 4px);white-space:normal;width:196px}
nav.side{overflow:visible}
.fwbody{display:flex;gap:24px;align-items:flex-start}
.rail{width:232px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;position:sticky;top:70px}

.lt.ni{color:var(--neu);background:var(--neu-b);border-color:transparent}

.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.cnt{font-size:11.5px;background:var(--neu-b);color:var(--neu);border-radius:999px;padding:1px 7px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(31,29,26,.28);z-index:50}

  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dhead{padding:20px 24px 0;display:flex;flex-direction:column;gap:12px}

.props{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;font-size:13.5px;align-items:center}

.li{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px}
.li .t{font-weight:500}
.tag{font-size:11.5px;color:var(--mute);border:1px solid var(--line3);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.q{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
select{height:32px;border:1px solid var(--line3);border-radius:8px;background:var(--card);color:var(--ink);font:400 13px var(--sans);padding:0 8px}
.tmpl{background:var(--zebra);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:13.5px}
.tmpl h4{margin:0 0 6px;font:600 13.5px var(--sans)}
.tmpl ol,.tmpl ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

/* how to fix */
pre.cmd{margin:0;background:#1F1D1A;color:#F1EEE9;border-radius:8px;padding:12px 14px;font:400 12.5px/1.5 var(--mono);overflow-x:auto;white-space:pre}
.steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}

.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .8s linear infinite}

.flash td{animation:fl 1.6s ease}

function provOf(t){ if(/^(Default branch|Pull requests|Secret scanning|Dependabot)/.test(t)) return 'gh'; if(/^Cloud Storage/.test(t)) return 'gcp'; return 'aws'; }
var FW=[['iso27001','ISO 27001'],['soc2','SOC 2'],['nis2','NIS2'],['gdpr','GDPR'],['dora','DORA'],['tisax','TISAX'],['pci','PCI DSS'],['iso42001','ISO 42001'],['euai','EU AI Act'],['hipaa','HIPAA']];
function fwt(i,size){ var f=FW[i], c='fwt'+(size?' '+size:'');
  return FWL[f[0]]? '<span class="'+c+'" title="'+f[1]+'"><img src="'+FWL[f[0]]+'" alt="'+f[1]+'"></span>' : '<span class="'+c+'" title="'+f[1]+'" style="color:var(--neu)">'+f[1]+'</span>'; }
var TIP='Available in the full app. Try it in your pilot.';
function hb(label,icon,tip){ return '<span class="btn bs sm hov" role="button" aria-disabled="true" data-tip="'+(tip||TIP)+'">'+(icon?ic(icon,14):'')+label+'</span>'; }
function readyCard(id){ return '<div class="card pad"'+(id?' id="'+id+'"':'')+' style="display:flex;flex-direction:column;gap:18px">'+
    '<div class="between" style="align-items:flex-start"><div style="display:flex;flex-direction:column;gap:4px"><span class="sub" style="font-size:13px">ISO 27001 audit readiness</span><span class="big">46%</span></div>'+fwt(0)+'</div>'+
    '<div class="stack"><div style="width:46%;background:var(--ok-d)"></div><div style="width:37%;background:var(--info-d)"></div><div style="width:17%;background:#DAD5CD"></div></div>'+
    '<div class="grid3" style="gap:12px">'+
      '<div><span class="sub row" style="gap:6px"><span class="dot" style="background:var(--ok-d)"></span>Implemented</span><div class="num">43</div></div>'+
      '<div><span class="sub row" style="gap:6px"><span class="dot" style="background:var(--info-d)"></span>In progress</span><div class="num">34</div></div>'+
      '<div><span class="sub row" style="gap:6px"><span class="dot" style="background:var(--neu-d)"></span>Not started</span><div class="num">16</div></div>'+
    '</div><span class="sub">93 Annex A controls. Every control shows the tests and documents that prove it.</span></div>'; }
function ic(n,s){return '<svg width="'+(s||17)+'" height="'+(s||17)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[n]+'</svg>';}
function bdg(kind,text){return '<span class="bdg '+kind+'"><span class="dot"></span>'+text+'</span>';}

function cancelGlide(){ cancelAnimationFrame(glideRaf); glideRaf=null; }
function glideTo(y,done){
  var y0=scrollY, d=y-y0;
  if(Math.abs(d)<4 || matchMedia('(prefers-reduced-motion: reduce)').matches){ window.scrollTo(0,y); done&&done(); return; }
  var dur=Math.min(1150,Math.max(600,Math.abs(d)*0.85)), t0=null;
  var ease=function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
  var step=function(ts){ if(t0===null) t0=ts; var t=Math.min(1,(ts-t0)/dur);
    window.scrollTo(0,y0+d*ease(t));
    if(t<1) glideRaf=requestAnimationFrame(step); else { glideRaf=null; done&&done(); } };
  glideRaf=requestAnimationFrame(step);
}
['wheel','touchstart','keydown'].forEach(function(ev){ window.addEventListener(ev,function(){ if(glideRaf){ cancelGlide(); } },{passive:true}); });
function pgIn(){ lastNav=Date.now(); main.classList.remove('pg-in'); void main.offsetWidth; main.classList.add('pg-in'); }

  else { pc=[0,0,0,0,0,Math.round(fin/2),fin]; st=['Not started','Not started','Not started','Not started','Not started','Not started','Not started']; }
  return EFFD.map(function(d,i){return {d:d,p:pc[i],s:st[i]};});
